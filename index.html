<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intervenções TMA/TMS: custos, tipo e localização</title>
<style>
:root{
  color-scheme:light;
  --brand:#052b4d; --brand2:#0b3a66; --accent:#e8792b;
  --page:#f3f6f9; --surface:#ffffff; --surface2:#f7f9fb;
  --ink:#0b1b2b; --ink2:#4a5a6a; --muted:#7d8b98; --line:#e3e8ee; --grid:#e8ecf0;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --other:#c3c2b7;
  --c1:#d03b3b; --c2:#ec835a; --c3:#9aa5b1;
  --seq0:#f4f8fd; --seq1:#cde2fb; --seq2:#9ec5f4; --seq3:#5598e7; --seq4:#256abf; --seq5:#104281;
  --shadow:0 1px 2px rgba(5,43,77,.06),0 4px 16px rgba(5,43,77,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d1117; --surface:#161b22; --surface2:#1c222b;
    --ink:#f0f3f6; --ink2:#c3cbd4; --muted:#8b96a2; --line:#2a313b; --grid:#252c35;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --other:#5d5d58;
    --c3:#6b7682;
    --seq0:#1a2230; --seq1:#173459; --seq2:#1c4b85; --seq3:#2a6ac0; --seq4:#4f8fe0; --seq5:#8fbcf3;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d1117; --surface:#161b22; --surface2:#1c222b;
  --ink:#f0f3f6; --ink2:#c3cbd4; --muted:#8b96a2; --line:#2a313b; --grid:#252c35;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --other:#5d5d58;
  --c3:#6b7682;
  --seq0:#1a2230; --seq1:#173459; --seq2:#1c4b85; --seq3:#2a6ac0; --seq4:#4f8fe0; --seq5:#8fbcf3;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--s1)}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{position:relative;color:#fff;background:#052b4d  center 62%/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,43,77,.96) 0%,rgba(5,43,77,.86) 45%,rgba(5,43,77,.45) 100%)}
.hero .wrap{position:relative;padding:22px 20px 26px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{background:#fff;border-radius:8px;padding:6px 10px;display:inline-flex}
.logo img{height:38px;display:block}
.tag{border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:5px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.eyebrow{margin-top:26px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9ec5f4;font-weight:700}
.hero h1{margin:6px 0 6px;font-size:30px;line-height:1.15;letter-spacing:-.01em}
.hero p{margin:0;color:#d4e2f0;max-width:820px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600}
.theme-btn{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.filters{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--page) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.filters .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding-top:10px;padding-bottom:10px}
.f{display:flex;flex-direction:column;gap:3px;min-width:150px}
.f label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input[type=search]{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:0 10px;font:inherit;font-size:13px}
input[type=search]{min-width:230px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);height:34px}
.seg button{border:0;background:transparent;color:var(--ink2);padding:0 11px;font:inherit;font-size:12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.btn{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.spacer{flex:1}
.active-note{font-size:12px;color:var(--muted);padding-bottom:8px}
main{padding:18px 20px 40px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(var(--nk,6),minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--line);border-left:4px solid var(--s1);padding:12px 14px}
.kpi .l{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.kpi .v{font-size:26px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.kpi .s{font-size:11px;color:var(--muted)}
h2{font-size:15px;margin:26px 0 10px;color:var(--ink);display:flex;align-items:baseline;gap:10px}
h2 small{font-weight:400;color:var(--muted);font-size:12px}
.grid{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.card h3{margin:0 0 2px;font-size:13px} .card .sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.donut{display:flex;align-items:center;gap:14px}
.donut svg{flex:0 0 auto}
.legend{list-style:none;margin:0;padding:0;font-size:12px;flex:1;min-width:0}
.legend li{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer}
.legend li:hover,.legend li.on{background:var(--surface2)}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.legend .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600}
.legend .pc{color:var(--muted);width:38px;text-align:right;font-variant-numeric:tabular-nums}
svg text{fill:var(--ink2);font:11px system-ui,-apple-system,"Segoe UI",sans-serif}
.axis{stroke:var(--line)} .gridl{stroke:var(--grid)}
.heat{width:100%;border-collapse:separate;border-spacing:2px;font-size:12px}
.heat th{font-size:10px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;padding:4px 2px;vertical-align:bottom}
.heat th.r{text-align:left;font-size:12px;text-transform:none;letter-spacing:0;color:var(--ink);padding-right:8px;white-space:nowrap}
.heat td{text-align:center;border-radius:4px;height:30px;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600}
.heat td:hover{outline:2px solid var(--ink)}
.heat td.tot{background:transparent!important;color:var(--ink);cursor:default}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 8px;cursor:pointer;white-space:nowrap}
table.t td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{max-height:520px;overflow:auto;border-radius:8px}
.mbar{display:flex;align-items:center;gap:6px}
.mbar i{display:block;height:8px;border-radius:0 4px 4px 0;background:var(--s1)}
.ivbar{position:relative;height:8px;background:var(--surface2);border-radius:4px;width:90px}
.ivbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--s3)}
.ivbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--c1)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:color-mix(in srgb,var(--accent) 75%,var(--ink));border-radius:4px;padding:1px 6px;margin:1px 2px 1px 0}
.strip{display:flex;gap:2px}.strip span{width:20px;height:18px;border-radius:3px;font-size:10px;font-weight:700;display:grid;place-items:center}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:8px;font-size:12px;color:var(--muted)}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:var(--surface);padding:7px 9px;border-radius:7px;font-size:12px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;transition:opacity .08s;max-width:280px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.15);z-index:60;transform:translateX(102%);transition:transform .2s ease;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start;gap:10px}
#drawer .body{padding:12px 18px;overflow:auto}
.rec{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:12.5px}
.rec .meta{font-size:11px;color:var(--muted);margin-bottom:3px;display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:12px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note ul{margin:6px 0 0 18px;padding:0}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}
.pes{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c1);border:1px solid color-mix(in srgb,var(--c1) 40%,transparent);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
#drawer table.t{font-size:12px} #drawer h3 small{font-weight:400;color:var(--muted)}
footer{color:var(--muted);font-size:12px;padding:20px 0 40px}
.mapa-wrap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px}
.mapa-box{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.mapa-box svg{display:block;touch-action:none;cursor:grab}
.mapa-box svg.arrastando{cursor:grabbing}
.mapa-ctl{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapa-ctl button{min-width:34px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:600 12px system-ui,sans-serif;cursor:pointer;box-shadow:var(--shadow)}
.mapa-rod{position:absolute;left:10px;bottom:8px;font-size:10.5px;color:var(--muted);pointer-events:none}
.mapa-leg{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:8px;font-size:12px}
.mapa-leg .sw{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.mapa-leg li{list-style:none;cursor:pointer;padding:2px 4px;border-radius:5px}.mapa-leg li:hover,.mapa-leg li.on{background:var(--surface2)}
.mapa-leg ul{display:flex;flex-wrap:wrap;gap:2px 8px;margin:0;padding:0}
.uf{fill:var(--surface);stroke:var(--line);stroke-width:1}
.uf-rot{font-size:9px!important;fill:var(--muted)!important;pointer-events:none}
.ficha{border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-height:540px;overflow:auto;font-size:12.5px}
.ficha .eti{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ficha h4{margin:4px 0 2px;font-size:18px}
.ficha dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;margin:10px 0}
.ficha dt{font-size:11px;color:var(--muted)} .ficha dd{margin:0;font-weight:600}
.ficha .acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
@media (max-width:900px){.mapa-wrap{grid-template-columns:minmax(0,1fr)}}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:minmax(0,1fr)!important}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:23px}.tag{display:none}.f{min-width:0;flex:1 1 45%}.f select,.f .seg{width:100%}input[type=search]{min-width:0;width:100%}.spacer{display:none}.kpi .v{font-size:22px}h2{flex-wrap:wrap}.donut{flex-direction:column;align-items:stretch}.donut svg{align-self:center}}
@media print{.filters,#drawer,.theme-btn{display:none}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

<style>
body.locked > :not(#gate){display:none!important}
#gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#052b4d}
#gate form{position:relative;background:#fff;color:#0b1b2b;border-radius:14px;padding:26px 28px;width:min(360px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.35)}
#gate img{height:40px;display:block;margin-bottom:14px}
#gate h1{font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif;margin:0 0 4px}
#gate p{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;color:#4a5a6a;margin:0 0 14px}
#gate input{width:100%;height:40px;border:1px solid #cfd8e2;border-radius:8px;padding:0 12px;font:15px system-ui,sans-serif}
#gate button{margin-top:10px;width:100%;height:40px;border:0;border-radius:8px;background:#052b4d;color:#fff;font:600 14px system-ui,sans-serif;cursor:pointer}
#gate .err{color:#d03b3b;font:12px system-ui,sans-serif;min-height:16px;margin-top:8px}
#gate small{display:block;margin-top:10px;color:#7d8b98;font:11px system-ui,sans-serif}
</style>
</head>

<script type="text/plain" id="appcode">
const DATA = window.__DK_DATA;
const S = DATA.spec;
const $ = s => document.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue('--'+v).trim();
const fmt = n => (n==null||isNaN(n)) ? '–' : Math.round(n).toLocaleString('pt-BR');
const fmtMoeda = n => { const a=Math.abs(Number(n)||0); if(a>=1000000) return 'R$ '+(Number(n)/1000000).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' mi'; if(a>=1000) return 'R$ '+(Number(n)/1000).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' mil'; return 'R$ '+fmt(n); };
const fmtM = (n, f) => f==='moeda' ? fmtMoeda(n) : f==='decimal' ? Number(n).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) : fmt(n);
const dec1 = n => Number(n).toFixed(1).replace('.',',');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dBR = s => s ? s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4) : '–';
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ID = S.id, ENT = S.entidade, R = DATA.rows;
const st = {f:{}, q:'', page:0, sortE:null, sortR:[S.registros.ordem || (S.registros.colunas[0]||{}).campo, 1]};

/* ---------- estado na URL (#Dim=valor&q=busca) — permite link para um recorte ---------- */
function lerHash(){ const h = decodeURIComponent(location.hash.slice(1)); if(!h) return; h.split('&').forEach(p=>{ const i=p.indexOf('='); if(i<0) return; const k=p.slice(0,i), v=p.slice(i+1); if(k==='q') st.q=v; else st.f[k]=v; }); }
function gravarHash(){ const p = Object.entries(st.f).filter(([,v])=>v).map(([k,v])=>k+'='+v); if(st.q) p.push('q='+st.q); history.replaceState(null,'',p.length?'#'+encodeURIComponent(p.join('&')).replace(/%3D/g,'=').replace(/%26/g,'&'):location.pathname); }

/* ---------- cabeçalho ---------- */
$('#tag').textContent = S.projeto.tag; $('#eyebrow').textContent = S.projeto.eyebrow;
$('#titulo').textContent = S.projeto.titulo; $('#subtitulo').textContent = S.projeto.subtitulo;
$('#chips').innerHTML = S.projeto.chips.concat(['Gerado em ' + DATA.gerado]).map(c=>`<span class="chip">${esc(c)}</span>`).join('');
if(!S.projeto.tag) $('#tag').style.display='none';
$('#themeBtn').onclick = () => { const r=document.documentElement; const cur=r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.dataset.theme = cur==='dark'?'light':'dark'; try{localStorage.setItem('dkTheme', r.dataset.theme)}catch(e){} render(); };
try{ const t=localStorage.getItem('dkTheme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}

/* ---------- filtros ---------- */
const FIL = S.filtros.filter(f=>f.tipo==='categoria' && f.html!==false);
const curto = (f,v) => f.curto ? String(v).split(' · ')[0] : v;
$('#filtros').innerHTML = FIL.map((f,i)=> f.estilo==='botoes'
  ? `<div class="f"><label>${esc(f.rotulo)}</label><div class="seg" data-i="${i}"><button data-v="" aria-pressed="true">Todas</button>${DATA.cats[f.campo].map(v=>`<button data-v="${esc(v)}" title="${esc(v)}">${esc(curto(f,v))}</button>`).join('')}</div></div>`
  : `<div class="f"><label for="f${i}">${esc(f.rotulo)}</label><select id="f${i}" data-i="${i}"><option value="">Todos</option>${DATA.cats[f.campo].map(v=>`<option>${esc(v)}</option>`).join('')}</select></div>`).join('')
  + (S.busca.length?`<div class="f"><label for="fBusca">Busca</label><input id="fBusca" type="search" placeholder="${esc(S.busca_dica||'buscar…')}"></div>`:'')
  + `<span class="spacer"></span><button class="btn" id="btnLimpar" type="button">Limpar filtros</button><button class="btn primary" id="btnCsv" type="button">Exportar CSV</button>`;
document.querySelectorAll('#filtros select').forEach(el=>el.onchange=e=>{ st.f[FIL[+el.dataset.i].campo]=e.target.value; st.page=0; render(); });
document.querySelectorAll('#filtros .seg').forEach(el=>el.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; st.f[FIL[+el.dataset.i].campo]=b.dataset.v; st.page=0; render(); });
if($('#fBusca')) $('#fBusca').oninput = e => { st.q = e.target.value; st.page = 0; render(); };
$('#btnLimpar').onclick = () => { st.f={}; st.q=''; st.page=0; if($('#fBusca')) $('#fBusca').value=''; render(); };
const toggle = (dim, v) => { st.f[dim] = st.f[dim]===v ? '' : v; st.page=0; render(); };

function filtrar(pular=[], busca=true, rows=R){
  const q = busca ? norm(st.q) : '';
  return rows.filter(r => Object.entries(st.f).every(([k,v]) => !v || pular.includes(k) || !(k in r) || r[k]===v) &&
    (!q || norm(S.busca.map(c=>r[c]).join(' ')).includes(q)));
}
const medida = (rows, nome='registros') => { const m=S.medidas[nome]; if(m.tipo==='contagem') return rows.length;
  if(m.tipo==='distintos') return new Set(rows.map(r=>r[m.campo]).filter(v=>v!==null && v!==undefined && String(v).trim()!=='')).size; const v=rows.map(r=>+r[m.campo]).filter(x=>!isNaN(x)); const s=v.reduce((a,b)=>a+b,0); return m.tipo==='soma'? s : (v.length? s/v.length : 0); };
const contaPor = (rows, dim, med='registros') => { const g={}; rows.forEach(r=>{ (g[r[dim]] ||= []).push(r); }); const o={}; for(const k in g) o[k]=medida(g[k],med); return o; };
const entsVis = () => { if(!ENT) return []; const g=ENT.grupo, v=g && st.f[g]; return DATA.ents.filter(e=>!v || e[g]===v); };
const opF = {'>':(a,b)=>a>b,'>=':(a,b)=>a>=b,'<':(a,b)=>a<b,'<=':(a,b)=>a<=b,'==':(a,b)=>a==b,'!=':(a,b)=>a!=b};
function onde(rows, expr){ if(!expr) return rows; const m=expr.match(/^\s*(.+?)\s*(>=|<=|!=|==|>|<)\s*(.+?)\s*$/); const c=m[1], op=m[2], v=isNaN(+m[3])?m[3].replace(/['"]/g,''):+m[3]; return rows.filter(r=>r[c]!==null && r[c]!=='' && opF[op](isNaN(+r[c])?r[c]:+r[c], v)); }

/* ---------- tooltip ---------- */
const tip = $('#tip');
function showTip(e, html){ tip.innerHTML = html; tip.style.opacity = 1; const x = Math.min(e.clientX+14, innerWidth - tip.offsetWidth - 8); const y = Math.min(e.clientY+14, innerHeight - tip.offsetHeight - 8); tip.style.left = x+'px'; tip.style.top = y+'px'; }
function hideTip(){ tip.style.opacity = 0; }
function bindTip(el, fn){ el.addEventListener('mousemove', e=>showTip(e, fn())); el.addEventListener('mouseleave', hideTip); }

/* ---------- KPIs ---------- */
function kpiNum(k){
  if(k.tipo==='medida'){ let rr=filtrar(); for(const [d,v] of Object.entries(k.onde||{})) rr=rr.filter(r=>r[d]===v); return medida(rr, k.medida||'registros'); }
  if(k.tipo==='contar') return filtrar([], false, DATA.aux[k.tabela]).length;
  if(k.tipo==='entidades') return onde(entsVis(), k.onde).length;
}
function kpis(){
  const rr = filtrar(); const nVis = entsVis().length;
  const vars = {entidades_com_registro: ENT? new Set(rr.map(r=>r[ENT.chave])).size : 0, por_entidade: dec1(nVis? rr.length/nVis : 0)};
  const sub = s => String(s||'').replace(/\{(\w+)\}/g, (m,k)=> k in vars ? vars[k] : m);
  $('#kpis').style.setProperty('--nk', Math.min(6, S.kpis.length));
  $('#kpis').innerHTML = S.kpis.map((k,i)=>{
    let txt;
    if(k.tipo==='fracao'){ txt = `${kpiNum({...k.num, tipo:k.num.tipo||'entidades'})} / ${kpiNum({...k.den, tipo:k.den.tipo||'entidades'})}`; }
    else if(k.tipo==='faixa'){ let v=entsVis().map(e=>e[k.campo]).filter(x=>x!==null && x!=='' && !isNaN(+x)).map(Number); if(k.ignorar_zero) v=v.filter(x=>x>0); txt = v.length? `${fmt(Math.min(...v))}–${fmt(Math.max(...v))}${k.sufixo||''}` : '–'; }
    else { const n=kpiNum(k); txt = fmtM(n, k.tipo==='medida'? S.medidas[k.medida||'registros'].formato : 'inteiro') + (k.sufixo||''); }
    const c = css(k.cor||'s1');
    return `<div class="kpi" style="border-left-color:${c}"><div class="l">${esc(k.rotulo)}</div><div class="v" data-kpi="${i}" style="${k.destaque?'color:'+c:''}">${esc(txt)}</div><div class="s">${esc(sub(k.sub))}</div></div>`;
  }).join('');
}

/* ---------- rosca ---------- */
function donut(host, items, onClick, activeKey, centro){
  const total = items.reduce((s,i)=>s+i.n,0) || 1, Ro=70, ri=46, C=86, gap=0.012, svgNS='http://www.w3.org/2000/svg';
  let a0 = -Math.PI/2;
  host.innerHTML = `<svg width="172" height="172" viewBox="0 0 172 172" role="img" aria-label="Gráfico de rosca"></svg><ul class="legend"></ul>`;
  const svg = host.querySelector('svg'), ul = host.querySelector('ul');
  items.forEach(it => {
    const frac = it.n/total, a1 = a0 + frac*2*Math.PI;
    if(it.n){
      const s = a0 + (frac>gap*2?gap:0), e = a1 - (frac>gap*2?gap:0), large = (e-s) > Math.PI ? 1 : 0;

/* ---------- mapa (SVG do Brasil por UF · agrupamento por proximidade · zoom · ficha) ---------- */
const BR = {lon0:-74.2, lon1:-34.5, lat0:-34.0, lat1:5.6};
function cMapa(host, c){
  const rr = filtrar(); const key = c.agrupar_por || ID;
  c._cor = c._cor || c.cor;
  const corDim = c._cor, coresDe = (c._coresPor||{})[corDim] || {};
  const G = {}, sem = new Set();
  rr.forEach(r=>{ const la = +r[c.lat], lo = +r[c.lon], k = r[key];
    if(!la || !lo || isNaN(la) || isNaN(lo)){ sem.add(k); return; }
    (G[k] ||= {k, la, lo, rows:[]}).rows.push(r); });
  const pts = Object.values(G);
  pts.forEach(g=>{ g.v = medida(g.rows, c.tamanho);
    if(corDim){ const cc = contaPor(g.rows, corDim, c.tamanho); g.cat = Object.entries(cc).sort((a,b)=>b[1]-a[1])[0][0]; } });
  const total = pts.reduce((s,p)=>s+p.v,0); const vmax = Math.max(1e-9, ...pts.map(p=>p.v));
  // moldura e projeção (equiretangular com correção do cosseno da latitude média)
  if(!host.querySelector('.mapa-wrap')){
    host.innerHTML = `<div class="mapa-wrap"><div><div class="mapa-box"><svg tabindex="0" aria-label="Mapa interativo — clique e use + / − para zoom e as setas para mover"></svg>
      <div class="mapa-ctl"><button data-a="+" title="Aproximar">+</button><button data-a="-" title="Afastar">−</button><button data-a="foco" title="Enquadrar o recorte">Foco</button><button data-a="br" title="Brasil inteiro">BR</button></div>
      <div class="mapa-rod"></div></div><div class="mapa-leg"></div></div><div class="ficha"></div></div>`;
  }
  const box = host.querySelector('.mapa-box'), svg = host.querySelector('svg');
  const W = box.clientWidth || 760, H = Math.max(380, Math.min(560, Math.round(W*0.78)));
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  const cosl = Math.cos(-14*Math.PI/180);
  const OSM = c.fundo === 'osm';   // fundo OpenStreetMap (opt-in) × malha de UF (padrão)
  const mercX = lo => (lo+180)/360*256, mercY = la => { const s=Math.max(-0.9999,Math.min(0.9999,Math.sin(la*Math.PI/180))); return (0.5 - Math.log((1+s)/(1-s))/(4*Math.PI))*256; };
  const px = lo => OSM ? mercX(lo) : (lo - BR.lon0)*cosl, py = la => OSM ? mercY(la) : (BR.lat1 - la);
  const enquadrar = (lo0, lo1, la0, la1, folga=1.12) => { const w=Math.abs(px(lo1)-px(lo0))*folga+1e-6, h=Math.abs(py(la0)-py(la1))*folga+1e-6; const k=Math.min(W/w, H/h);
    return {k, tx: W/2 - k*((px(lo0)+px(lo1))/2), ty: H/2 - k*((py(la0)+py(la1))/2)}; };
  const vistaBR = () => enquadrar(BR.lon0, BR.lon1, BR.lat0, BR.lat1, 1.02);
  const vistaFoco = () => pts.length ? enquadrar(Math.min(...pts.map(p=>p.lo))-0.6, Math.max(...pts.map(p=>p.lo))+0.6, Math.min(...pts.map(p=>p.la))-0.6, Math.max(...pts.map(p=>p.la))+0.6) : vistaBR();
  if(!c._v || c._W !== W){ c._v = vistaFoco(); c._W = W; }
  const V = c._v, X = lo => V.tx + V.k*px(lo), Y = la => V.ty + V.k*py(la);
  // fundo: tiles OpenStreetMap (opt-in) ou malha de UF em SVG (padrão)
  let g = '';
  if(OSM){
    const z = Math.max(2, Math.min(19, Math.round(Math.log2(V.k)))), n = 2**z, unit = 256/n, tsz = V.k*unit;
    const i0 = Math.floor(((0-V.tx)/V.k)/unit), i1 = Math.floor(((W-V.tx)/V.k)/unit);
    const j0 = Math.floor(((0-V.ty)/V.k)/unit), j1 = Math.floor(((H-V.ty)/V.k)/unit);
    for(let i=i0;i<=i1;i++) for(let j=j0;j<=j1;j++){ if(i<0||j<0||i>=n||j>=n) continue;
      const x = V.tx + V.k*i*unit, y = V.ty + V.k*j*unit;
      g += `<image href="https://tile.openstreetmap.org/${z}/${i}/${j}.png" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(tsz+1).toFixed(1)}" height="${(tsz+1).toFixed(1)}" preserveAspectRatio="none"/>`; }
  } else {
    (DATA.geo.ufs||[]).forEach(u=>{ const d = u.aneis.map(a=>'M'+a.map(([lo,la])=>X(lo).toFixed(1)+' '+Y(la).toFixed(1)).join('L')+'Z').join(''); g += `<path class="uf" d="${d}"/>`; });
    (DATA.geo.ufs||[]).forEach(u=>{ g += `<text class="uf-rot" x="${X(u.centro[0]).toFixed(1)}" y="${Y(u.centro[1]).toFixed(1)}" text-anchor="middle">${u.uf}</text>`; });
  }
  // agrupamento em coordenadas de tela
  const R = 22, cl = [];
  pts.slice().sort((a,b)=>b.v-a.v).forEach(p=>{ const x=X(p.lo), y=Y(p.la);
    const alvo = cl.find(q=>Math.hypot(q.x-x, q.y-y) < R);
    if(alvo){ alvo.m.push(p); alvo.v += p.v; } else cl.push({x, y, m:[p], v:p.v}); });
  cl.forEach((q,i)=>{
    if(q.m.length===1){ const p=q.m[0], r=4+10*Math.sqrt(p.v/vmax), sel=c._sel===p.k;
      const cor = corDim ? css(coresDe[p.cat]||'other') : css('s1');
      g += `<circle class="pt" data-i="${i}" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${r.toFixed(1)}" fill="${cor}" fill-opacity=".85" stroke="${sel?'var(--accent)':'#fff'}" stroke-width="${sel?3:1.2}" style="cursor:pointer"/>`; }
    else { const r = 11 + Math.min(12, Math.sqrt(q.m.length)*2.2), sel = q.m.some(p=>p.k===c._sel);
      g += `<g class="cl" data-i="${i}" style="cursor:pointer"><circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${r.toFixed(1)}" fill="var(--ink2)" fill-opacity=".9" stroke="${sel?'var(--accent)':'#fff'}" stroke-width="${sel?3:1.5}"/><text x="${q.x.toFixed(1)}" y="${(q.y+4).toFixed(1)}" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:11px">${q.m.length}</text></g>`; }
  });
  svg.innerHTML = g;
  const _base = OSM ? `${c.fonte_coord?c.fonte_coord+' · ':''}© OpenStreetMap contributors` : (c.fonte_coord||'Malha: IBGE');
  host.querySelector('.mapa-rod').textContent = `${_base} · ${pts.length} pontos${sem.size?` · ${sem.size} sem coordenada`:''} · arraste ou setas do teclado para mover, role ou + / − para zoom (clique no mapa antes de usar as teclas)`;
  host.dataset.pontos = pts.length; host.dataset.total = total; host.dataset.semcoord = sem.size;
  host.setAttribute('data-pontos', pts.length); host.setAttribute('data-total', total); host.setAttribute('data-semcoord', sem.size);
  // interações
  const nome = p => c.rotulo ? p.rows[0][c.rotulo] : p.k;
  svg.querySelectorAll('.pt').forEach(el=>{ const p = cl[+el.dataset.i].m[0];
    bindTip(el, ()=>`<b>${esc(nome(p))}</b><br>${fmtM(p.v, S.medidas[c.tamanho].formato)} ${esc(S.medidas[c.tamanho].rotulo)}${corDim?`<br>${esc(corDim)}: ${esc(p.cat)}`:''}`);
    el.onclick = e => { e.stopPropagation(); c._sel = c._sel===p.k ? null : p.k; cMapa(host, c); }; });
  svg.querySelectorAll('.cl').forEach(el=>{ const q = cl[+el.dataset.i];
    bindTip(el, ()=>`<b>${q.m.length} pontos</b><br>${fmtM(q.v, S.medidas[c.tamanho].formato)} ${esc(S.medidas[c.tamanho].rotulo)}<br>clique para aproximar`);
    el.onclick = e => { e.stopPropagation(); const lo=q.m.map(p=>p.lo), la=q.m.map(p=>p.la);
      c._v = enquadrar(Math.min(...lo)-0.15, Math.max(...lo)+0.15, Math.min(...la)-0.15, Math.max(...la)+0.15, 1.4); cMapa(host, c); }; });
  const zoom = (f, cx=W/2, cy=H/2) => { const k = Math.min(V.k*40, Math.max(vistaBR().k*0.8, V.k*f)), s = k/V.k; c._v = {k, tx: cx - s*(cx - V.tx), ty: cy - s*(cy - V.ty)}; cMapa(host, c); };
  host.querySelectorAll('.mapa-ctl button').forEach(b=>b.onclick = ()=>{ const a=b.dataset.a; if(a==='+') zoom(1.6); else if(a==='-') zoom(1/1.6); else { c._v = a==='br' ? vistaBR() : vistaFoco(); cMapa(host, c); } });
  svg.onwheel = e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoom(e.deltaY<0?1.25:0.8, e.clientX-r.left, e.clientY-r.top); };
  svg.onkeydown = e => { const pan = (dx,dy)=>{ c._v = {k:V.k, tx:V.tx+dx, ty:V.ty+dy}; cMapa(host, c); }, p = Math.max(30, Math.round(Math.min(W,H)*0.12));
    if(e.key==='+'||e.key==='='){ e.preventDefault(); zoom(1.6); }
    else if(e.key==='-'||e.key==='_'){ e.preventDefault(); zoom(1/1.6); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); pan(p,0); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); pan(-p,0); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); pan(0,p); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); pan(0,-p); }
    else if(e.key==='0'||e.key==='Home'){ e.preventDefault(); c._v = vistaFoco(); cMapa(host, c); } };
  svg.onpointerdown = e => { if(e.target.closest('.pt,.cl')) return; const x0=e.clientX, y0=e.clientY, t0={...V}; svg.classList.add('arrastando'); svg.setPointerCapture(e.pointerId);
    svg.onpointermove = ev => { c._v = {k:t0.k, tx:t0.tx+ev.clientX-x0, ty:t0.ty+ev.clientY-y0}; cMapa(host, c); };
    svg.onpointerup = () => { svg.onpointermove = null; svg.classList.remove('arrastando'); }; };
  // legenda + "cor por"
  const opc = [c.cor].concat(c.cores_alternativas||[]).filter(Boolean);
  const cnt = {}; pts.forEach(p=>{ cnt[p.cat] = (cnt[p.cat]||0) + p.v; });
  host.querySelector('.mapa-leg').innerHTML = (opc.length>1 ? `<label style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Cor por <select class="mapa-cor" style="height:28px;margin-left:4px">${opc.map(o=>`<option ${o===corDim?'selected':''}>${esc(o)}</option>`).join('')}</select></label>` : '') +
    (corDim ? `<ul>${DATA.cats[corDim].filter(k=>cnt[k]).map(k=>`<li data-k="${esc(k)}" class="${st.f[corDim]===k?'on':''}"><span class="sw" style="background:${css(coresDe[k]||'other')}"></span>${esc(k)} <span style="color:var(--muted)">${fmtM(cnt[k], S.medidas[c.tamanho].formato)}</span></li>`).join('')}</ul>` : '');
  const selc = host.querySelector('.mapa-cor'); if(selc) selc.onchange = e => { c._cor = e.target.value; cMapa(host, c); };
  host.querySelectorAll('.mapa-leg li').forEach(li=>li.onclick = ()=>toggle(corDim, li.dataset.k));
  // ficha
  const fx = host.querySelector('.ficha'); const p = pts.find(z=>z.k===c._sel);
  const val = (campo, v) => { if(v===null||v===undefined||v==='') return '–'; if(typeof v==='string' && /^https?:\/\//.test(v)) return `<a href="${esc(v)}" target="_blank" rel="noopener">abrir fonte</a>`; if(typeof v==='number') return v.toLocaleString('pt-BR',{maximumFractionDigits:1}); if(/^\d{4}-\d{2}-\d{2}/.test(v)) return dBR(v); return esc(v); };
  if(!p){ const top = pts.slice().sort((a,b)=>b.v-a.v).slice(0,8);
    fx.innerHTML = `<div class="eti">Ficha</div><p style="color:var(--muted);margin:6px 0 10px">Clique num ponto para ver a ficha. Números grandes no mapa são agrupamentos: clique para aproximar.</p>
      <div class="eti">Maiores do recorte</div>${top.map(z=>`<div class="rec" data-k="${esc(z.k)}" style="cursor:pointer;display:flex;justify-content:space-between;gap:8px"><span>${esc(nome(z))}</span><b class="num">${fmtM(z.v, S.medidas[c.tamanho].formato)}</b></div>`).join('') || '<p class="empty">Nada no recorte.</p>'}`;
    fx.querySelectorAll('.rec').forEach(el=>el.onclick=()=>{ c._sel = el.dataset.k; const q = pts.find(z=>z.k===c._sel); if(q){ c._v = enquadrar(q.lo-0.8, q.lo+0.8, q.la-0.8, q.la+0.8); } cMapa(host, c); });
  } else {
    const r0 = p.rows[0]; const campos = c.ficha && c.ficha.length ? c.ficha : Object.keys(r0).filter(k=>k!==c.lat && k!==c.lon);
    const variam = campos.filter(k=>new Set(p.rows.map(r=>String(r[k]))).size>1);
    fx.innerHTML = `<div class="eti">Ficha${corDim?` · <span style="color:${css(coresDe[p.cat]||'other')}">●</span> ${esc(p.cat)}`:''}</div><h4>${esc(nome(p))}</h4>
      <dl>${campos.filter(k=>!variam.includes(k) && k!==c.rotulo && k!==c.ficha_texto).map(k=>`<div><dt>${esc(k)}</dt><dd>${val(k, r0[k])}</dd></div>`).join('')}</dl>
      ${p.rows.length>1 ? `<div class="eti">${p.rows.length} configurações</div><table class="t"><thead><tr>${variam.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${p.rows.map(r=>`<tr>${variam.map(k=>`<td>${val(k, r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>` : ''}
      ${c.ficha_texto && r0[c.ficha_texto] ? `<div class="note" style="margin-top:10px"><b>${esc(c.ficha_texto)}:</b> ${esc(r0[c.ficha_texto])}</div>` : ''}
      <div class="acoes">${ENT && r0[ENT.chave] ? `<button class="btn" data-a="filtrar">Filtrar ${esc(ENT.nome)}: ${esc(r0[ENT.chave])}</button><button class="btn" data-a="abrir">Abrir ${esc(ENT.nome)}</button>` : ''}<button class="btn" data-a="fechar">Fechar ficha</button></div>`;
    fx.querySelectorAll('.acoes button').forEach(b=>b.onclick = ()=>{ const a=b.dataset.a;
      if(a==='filtrar') toggle(ENT.chave, r0[ENT.chave]); else if(a==='abrir') abrir(r0[ENT.chave]); else { c._sel=null; cMapa(host, c); } });
  }
}

/* ---------- tabela da entidade ---------- */
function cTabela(host, c){
  const rr = filtrar(); const ch = ENT.chave; const by = {}; rr.forEach(r=>{ (by[r[ch]] ||= []).push(r); });
  const cols = c.colunas.filter(k=>k.so!=='excel');
  let rows = entsVis().map((e,i)=>{ const g = by[e[ch]]||[]; const o = {__e:e, __i:i, __n:g.length, [ch]:e[ch]};
    cols.forEach((k,j)=>{ const key='k'+j;
      if(k.campo) o[key] = e[k.campo];
      else if(k.calc==='contagem'){ let gg=g; for(const [d,v] of Object.entries(k.onde||{})) gg=gg.filter(r=>r[d]===v); o[key]=medida(gg, k.medida||'registros'); }
      else if(k.calc==='mais_citado'){ const cc=contaPor(g,k.dim); const t=Object.entries(cc).sort((a,b)=>b[1]-a[1])[0]; o[key]= t? t[0]+' ('+t[1]+')' : '–'; }
      else if(k.faixa){ o[key]=contaPor(g,k.faixa); } });
    return o; });
  const ativos = Object.entries(st.f).some(([d,v])=>v && d!==ENT.grupo) || st.q;
  if(ativos) rows = rows.filter(r=>r.__n>0);
  if(st.sortE){ const [k,dir]=st.sortE; rows.sort((a,b)=>{ const x=a[k], y=b[k]; return ((x>y)?1:(x<y)?-1:0)*dir; }); }
  const maxes = {}; cols.forEach((k,j)=>{ if(k.barra) maxes[j] = k.barra.max || Math.max(1, ...rows.map(r=>+r['k'+j]||0)); });
  const gmax = Math.max(1, ...rows.flatMap(r=>cols.flatMap((k,j)=>k.faixa? Object.values(r['k'+j]) : [])));
  const SEQ = ['seq0','seq1','seq2','seq3','seq4','seq5'];
  const cel = (k,j,r) => { const v = r['k'+j];
    if(k.faixa){ return `<div class="strip">${DATA.cats[k.faixa].map(cat=>{ const n=v[cat]||0; const kk = n? 1+Math.min(4,Math.floor(4.999*n/gmax)) : 0; return `<span title="${esc(cat)}: ${n}" style="background:var(--${SEQ[kk]});color:${kk>=3?'#fff':'var(--ink)'}">${n||''}</span>`; }).join('')}</div>`; }
    if(k.formato==='data') return dBR(v);
    if(k.formato==='lista'){ const it = String(v||'').split(',').map(s=>s.trim()).filter(Boolean); return it.map(p=>`<span class="pill">${esc(p)}</span>`).join('') || '<span style="color:var(--muted)">–</span>'; }
    if(k.barra && k.barra.limite) return `<div class="mbar"><span class="ivbar"><i style="width:${Math.min(100,100*(+v||0)/maxes[j])}%;background:${css(k.barra.cor||'s3')}"></i><b style="left:${100*k.barra.limite/maxes[j]}%"></b></span><span class="num">${v??'–'}</span></div>`;
    if(k.barra) return `<div class="mbar"><i style="width:${70*(+v||0)/maxes[j]}px;background:${css(k.barra.cor||'s1')}"></i><span class="num">${fmt(v)}</span></div>`;
    if(k.destaque) return v ? `<span class="badge" style="background:color-mix(in srgb,${css(k.destaque)} 16%,transparent);color:${css(k.destaque)}">${fmt(v)}</span>` : '·';
    if(k.calc==='contagem') return v ? fmt(v) : '·';
    if(typeof v==='number') return v.toLocaleString('pt-BR',{maximumFractionDigits:1});
    return esc(v ?? '–'); };
  const numc = k => k.calc==='contagem' || (k.barra && !k.barra.limite);
  host.innerHTML = `<table class="t"><thead><tr><th data-k="${esc(ch)}">${esc(ENT.nome)}</th>${cols.map((k,j)=>`<th data-k="k${j}">${esc(String(k.rotulo).split('\n')[0])}${st.sortE&&st.sortE[0]==='k'+j?(st.sortE[1]>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>` +
    (rows.length ? rows.map(r=>`<tr class="click" data-w="${esc(r[ch])}"><td><b>${esc(r[ch])}</b></td>${cols.map((k,j)=>`<td class="${numc(k)?'num':''}">${cel(k,j,r)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length+1}" class="empty">Nenhum ${esc(ENT.nome)} no filtro atual. <a href="#" id="eLimpa">Limpar filtros</a></td></tr>`) + '</tbody></table>';
  host.querySelectorAll('th').forEach(th=>th.onclick=()=>{ const k=th.dataset.k; const j=k.startsWith('k')?+k.slice(1):-1; const num = j>=0 && (numc(cols[j]) || cols[j].barra); st.sortE=[k, st.sortE&&st.sortE[0]===k ? -st.sortE[1] : (num?-1:1)]; cTabela(host,c); });
  host.querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>abrir(tr.dataset.w));
  const el = host.querySelector('#eLimpa'); if(el) el.onclick = e=>{ e.preventDefault(); $('#btnLimpar').click(); };
}

/* ---------- registros ---------- */
const COR_DIM = {}; S.filtros.forEach(f=>{ if(f._cores) COR_DIM[f.campo]=f._cores; });
const badge = (dim, v) => COR_DIM[dim] && COR_DIM[dim][v] ? `<span class="badge" style="background:color-mix(in srgb,${css(COR_DIM[dim][v])} 18%,transparent);color:color-mix(in srgb,${css(COR_DIM[dim][v])} 80%,var(--ink))" title="${esc(v)}">${esc(String(v).split(' · ')[0])}</span>` : esc(v);
function tabelaRec(rr){
  const cols = S.registros.colunas; const [k,dir] = st.sortR;
  const rows = rr.slice().sort((a,b)=> ((a[k]>b[k])?1:(a[k]<b[k])?-1:0)*dir || (a[ID]>b[ID]?1:-1));
  const per = 60, pages = Math.max(1, Math.ceil(rows.length/per)); st.page = Math.min(st.page, pages-1);
  const pg = rows.slice(st.page*per, st.page*per+per);
  const cel = (c, r) => { const v=r[c.campo]; if(typeof v==='string' && /^https?:\/\//.test(v)) return `<a href="${esc(v)}" target="_blank" rel="noopener">abrir</a>`; if(c.formato==='data') return `<span style="white-space:nowrap">${dBR(v)}</span>`; if(ENT && c.campo===ENT.chave) return `<a href="#" data-w="${esc(v)}" style="white-space:nowrap">${esc(v)}</a>`; if(COR_DIM[c.campo]) return badge(c.campo, v); return esc(v); };
  $('#tRec').innerHTML = `<thead><tr>${cols.map(c=>`<th data-k="${esc(c.campo)}">${esc(c.rotulo||c.campo)}${st.sortR[0]===c.campo?(st.sortR[1]>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>` +
    (pg.length ? pg.map(r=>`<tr>${cols.map(c=>`<td>${cel(c,r)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="empty">Nenhum registro no filtro atual.</td></tr>`) + '</tbody>';
  $('#tRec').querySelectorAll('th').forEach(th=>th.onclick=()=>{ const k=th.dataset.k; st.sortR=[k, st.sortR[0]===k?-st.sortR[1]:1]; tabelaRec(rr); });
  $('#tRec').querySelectorAll('a[data-w]').forEach(a=>a.onclick=e=>{ e.preventDefault(); abrir(a.dataset.w); });
  $('#recTitulo').innerHTML = `${esc(S.registros.titulo)} <small data-rec="${rows.length}">${fmt(rows.length)} no filtro atual</small>`;
  $('#pager').innerHTML = pages>1 ? `<button class="btn" ${st.page?'':'disabled'} id="pPrev">‹ Anterior</button> página ${st.page+1} de ${pages} <button class="btn" ${st.page<pages-1?'':'disabled'} id="pNext">Próxima ›</button>` : '';
  if(pages>1){ $('#pPrev').onclick=()=>{st.page--; tabelaRec(rr)}; $('#pNext').onclick=()=>{st.page++; tabelaRec(rr)}; }
}


/* ---------- células genéricas (tabela e relacionadas) ---------- */
function celula(col, r){ const v = r[col.campo];
  if(v===null || v===undefined || v==='') return '<span style="color:var(--muted)">–</span>';
  if(col.formato==='link') return /^https?:\/\//.test(v) ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(col.texto_link||'abrir')}</a>` : esc(v);
  if(col.formato==='data' || /^\d{4}-\d{2}-\d{2}$/.test(v)) return dBR(v);
  if(ENT && col.campo===ENT.chave) return `<a href="#" data-w="${esc(v)}">${esc(v)}</a>`;
  if(typeof v==='number') return v.toLocaleString('pt-BR',{maximumFractionDigits:1});
  return esc(v); }
function ordenar(rows, ordem){ const ks = [].concat(ordem||[]); return rows.slice().sort((a,b)=>{ for(const k of ks){ const x=a[k]??'', y=b[k]??''; if(x<y) return -1; if(x>y) return 1; } return 0; }); }

/* ---------- tabela de uma tabela auxiliar (ex.: agenda) ---------- */
function cTabelaAux(host, c){
  const rows = ordenar(filtrar([], false, DATA.aux[c.tabela]), c.ordem);
  const cols = c.colunas.length ? c.colunas : Object.keys(rows[0]||{}).map(k=>({campo:k}));
  host.setAttribute('data-linhas', rows.length);
  host.innerHTML = `<table class="t"><thead><tr>${cols.map(k=>`<th>${esc(k.rotulo||k.campo)}</th>`).join('')}</tr></thead><tbody>` +
    (rows.length ? rows.slice(0, c.max_linhas||400).map(r=>`<tr>${cols.map(k=>`<td>${celula(k, r)}</td>`).join('')}</tr>`).join('')
                 : `<tr><td colspan="${cols.length}" class="empty">Nada no filtro atual.</td></tr>`) + '</tbody></table>';
  host.querySelectorAll('a[data-w]').forEach(a=>a.onclick=e=>{ e.preventDefault(); abrir(a.dataset.w); });
}

/* ---------- gaveta da entidade ---------- */
function abrir(w){
  if(!ENT) return; const D = ENT.detalhe || {};
  const e = DATA.ents.find(x=>x[ENT.chave]===w) || {}; const rr = R.filter(r=>r[ENT.chave]===w);
  const ordDim = Object.keys(COR_DIM)[0];
  if(ordDim) rr.sort((a,b)=> (a[ordDim]>b[ordDim]?1:a[ordDim]<b[ordDim]?-1:0) || (D.agrupar && a[D.agrupar]>b[D.agrupar]?1:-1));
  $('#dwGrupo').textContent = ENT.grupo ? (e[ENT.grupo]||'') : ''; $('#dwTitle').textContent = w;
  $('#dwSub').innerHTML = (D.info||[]).map(i=>`${esc(i.rotulo||i.campo)} ${i.formato==='data'?dBR(e[i.campo]):(typeof e[i.campo]==='number'?e[i.campo].toLocaleString('pt-BR',{maximumFractionDigits:1}):esc(e[i.campo]??'–'))}${i.sufixo||''}`).concat([`${rr.length} registros`]).join(' · ');
  const grp = {}; rr.forEach(r=>{ (grp[D.agrupar? r[D.agrupar] : 'Registros'] ||= []).push(r); });
  const dest = D.destaque && e[D.destaque] ? String(e[D.destaque]).split(',').map(s=>s.trim()).filter(Boolean) : [];
  const meta = S.registros.colunas.filter(c=>c.campo!==ENT.chave && c.campo!==D.agrupar && c.campo!==S.registros.texto);
  const txt = D.texto && e[D.texto] ? `<div class="note" style="margin-bottom:10px"><b>${esc(D.texto)}:</b> ${esc(e[D.texto])}</div>` : '';
  const rels = (D.relacionadas||[]).map(rl=>{ const rr2 = ordenar((DATA.aux[rl.tabela]||[]).filter(x=>String(x[rl.chave])===String(w)), rl.ordem);
    const cols = rl.colunas.length ? rl.colunas : Object.keys(rr2[0]||{}).filter(k=>k!==rl.chave).map(k=>({campo:k}));
    return `<h3 style="font-size:13px;margin:14px 0 4px" data-rel="${esc(rl.titulo)}" data-n="${rr2.length}">${esc(rl.titulo)} <small>· ${rr2.length}</small>${rl.pessoais?'<span class="pes" title="Dados pessoais de fontes públicas: uso interno">dados pessoais</span>':''}</h3>` +
      (rr2.length ? `<div style="overflow-x:auto"><table class="t"><thead><tr>${cols.map(k=>`<th>${esc(k.rotulo||k.campo)}</th>`).join('')}</tr></thead><tbody>${rr2.map(x=>`<tr>${cols.map(k=>`<td>${celula(k, x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '<p class="empty" style="padding:6px">Nenhum registro.</p>'); }).join('');
  $('#dwBody').innerHTML = (dest.length?`<div class="note" style="margin-bottom:10px"><b>${esc(D.destaque)}:</b> ${dest.map(p=>`<span class="pill">${esc(p)}</span>`).join('')}</div>`:'') + txt + rels +
    (rr.length ? `<h3 style="font-size:13px;margin:16px 0 0">${esc(S.registros.titulo)} <small>· ${rr.length}</small></h3>` : '') +
    Object.entries(grp).map(([s,list])=>`<h3 style="font-size:13px;margin:14px 0 4px">${esc(s)} <span style="color:var(--muted);font-weight:400">· ${list.length}</span></h3>` +
      list.map(r=>`<div class="rec"><div class="meta">${meta.map(c=>`<span>${c.formato==='data'?dBR(r[c.campo]):COR_DIM[c.campo]?badge(c.campo,r[c.campo]):esc(r[c.campo])}</span>`).join('')}</div>${esc(r[S.registros.texto]||'')}</div>`).join('')).join('');
  $('#drawer').classList.add('open');
}
$('#dwClose').onclick = ()=>$('#drawer').classList.remove('open');
addEventListener('keydown', e=>{ if(e.key==='Escape') $('#drawer').classList.remove('open'); });

    c.tipo==='tabela' ? `<div class="card">${c.titulo?`<h3>${esc(c.titulo)}${c.pessoais?'<span class="pes" title="Dados pessoais de fontes públicas: uso interno">dados pessoais</span>':''}</h3>`:''}${c.sub?`<div class="sub">${esc(c.sub)}</div>`:''}<div class="scroll" id="${c._id}"></div></div>`
    : c.tipo==='mapa' ? `<div class="card">${c.titulo?`<h3>${esc(c.titulo)}</h3>`:''}${c.sub?`<div class="sub">${esc(c.sub)}</div>`:''}<div id="${c._id}"></div></div>`
    : c.tipo==='calor' ? `<div class="card" style="overflow-x:auto">${c.titulo?`<h3>${esc(c.titulo)}</h3><div class="sub">${esc(c.sub)}</div>`:''}<table class="heat" id="${c._id}"></table></div>`
    : c.tipo==='tabela_entidade' ? `<div class="card"><div class="scroll" id="${c._id}"></div></div>`
    : `<div class="card">${c.titulo?`<h3>${esc(c.titulo)}</h3>`:''}${c.sub?`<div class="sub">${esc(c.sub)}</div>`:''}<div class="${c.tipo==='rosca'?'donut':''}" id="${c._id}"></div></div>`).join('')}</div>`).join('');

function render(){
  FIL.forEach((f,i)=>{ const el=document.querySelector(`[data-i="${i}"]`); if(!el) return; if(el.tagName==='SELECT') el.value=st.f[f.campo]||''; else el.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===(st.f[f.campo]||'')))); });
  if($('#fBusca') && $('#fBusca').value!==st.q) $('#fBusca').value = st.q;
  const act = Object.entries(st.f).filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`).concat(st.q?[`Busca: “${st.q}”`]:[]);
  $('#activeNote').textContent = act.length ? 'Filtro ativo: ' + act.join(' · ') : '';
  kpis();
  S.secoes.forEach(sec=>sec.componentes.forEach(c=>{ const h=document.getElementById(c._id);
    ({rosca:cRosca, barras:cBarras, empilhado:cEmpilhado, calor:cCalor, tempo:cTempo, tabela_entidade:cTabela, mapa:cMapa, tabela:cTabelaAux})[c.tipo](h, c); }));
  tabelaRec(filtrar());
  gravarHash();
}
$('#notes').innerHTML = DATA.notas; if(!DATA.notas){ $('#notes').style.display='none'; $('#notasTitulo').style.display='none'; }
$('#foot').innerHTML = esc(DATA.rodape);
let rt; addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(render,120); });
lerHash(); render();
</script>
</body>
</html>
